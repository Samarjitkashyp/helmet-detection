{% if pages > 1 %}
<nav class="mt-3"><ul class="pagination pagination-sm mb-0">
  <li class="page-item {{ 'disabled' if page <= 1 }}"><a class="page-link" href="?page={{ page - 1 }}{{ qs }}">Prev</a></li>
  <li class="page-item disabled"><span class="page-link">{{ page }} / {{ pages }}</span></li>
  <li class="page-item {{ 'disabled' if page >= pages }}"><a class="page-link" href="?page={{ page + 1 }}{{ qs }}">Next</a></li>
</ul></nav>
{% endif %}
