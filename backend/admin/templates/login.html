{% extends "base.html" %}
{% block title %}Login - Helmet Admin{% endblock %}
{% block bare %}
<div class="container" style="max-width:400px; margin-top:12vh">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h4 class="mb-3"><i class="bi bi-shield-check"></i> Helmet Admin</h4>
    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
    <form method="post" action="/panel/login">
      <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required autofocus></div>
      <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
      <button class="btn btn-primary w-100">Login</button>
    </form>
  </div></div>
</div>
{% endblock %}
