# Axom AI Research: static pages served by nginx, next to the Next.js and Django apps of aiaxom.co.in.
# Installed as /etc/nginx/snippets/axom-research.conf and included once in the HTTPS server block of
# /etc/nginx/conf.d/aiaxom.co.in.conf (before the "Next.js Static chunks" location):
#     include /etc/nginx/snippets/axom-research.conf;
# Files live in /var/www/axom-research (research/..., llms.txt). `^~` makes these win over the regex locations that
# send some paths to Django, and nothing else of the main site is touched.
# add_header in a location replaces the ones inherited from the server block, so the security headers are repeated.

location = /research { return 301 /research/; }

# The helmet-detection report used to be six pages. It is one page now; the old addresses go to the matching section.
location = /research/helmet-detection/how-it-works/ { return 301 /research/helmet-detection/#how; }
location = /research/helmet-detection/how-it-works { return 301 /research/helmet-detection/#how; }
location = /research/helmet-detection/results/ { return 301 /research/helmet-detection/#results; }
location = /research/helmet-detection/results { return 301 /research/helmet-detection/#results; }
location = /research/helmet-detection/cctv-monitoring/ { return 301 /research/helmet-detection/#cctv; }
location = /research/helmet-detection/cctv-monitoring { return 301 /research/helmet-detection/#cctv; }
location = /research/helmet-detection/model-card/ { return 301 /research/helmet-detection/#model; }
location = /research/helmet-detection/model-card { return 301 /research/helmet-detection/#model; }
location = /research/helmet-detection/faq/ { return 301 /research/helmet-detection/#faq; }
location = /research/helmet-detection/faq { return 301 /research/helmet-detection/#faq; }

# Tell crawlers about the research sitemap without touching the Next.js app: robots.txt (generated by Next.js) gets a second
# Sitemap line. If the original line ever changes, the filter simply does nothing and robots.txt stays as Next.js made it.
location = /robots.txt {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Accept-Encoding "";
    sub_filter_types text/plain;
    sub_filter_once on;
    sub_filter 'Sitemap: https://aiaxom.co.in/sitemap.xml' 'Sitemap: https://aiaxom.co.in/sitemap.xml
Sitemap: https://aiaxom.co.in/research/sitemap.xml';
}

location = /llms.txt {
    root /var/www/axom-research;
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "public, max-age=3600" always;
    include /etc/nginx/snippets/axom-security-headers.conf;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /research/ {
    root /var/www/axom-research;
    index index.html;
    try_files $uri $uri/index.html =404;
    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml text/plain image/svg+xml;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    include /etc/nginx/snippets/axom-security-headers.conf;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CSS, JS and images carry a ?v= version in their link, so they can be cached for a long time
    location ~* ^/research/assets/.+\.(css|js|jpg|jpeg|png|webp|svg)$ {
        root /var/www/axom-research;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        include /etc/nginx/snippets/axom-security-headers.conf;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
